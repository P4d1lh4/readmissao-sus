[pytest]
pythonpath = src .
testpaths = tests
# Testes de integração (Docker + validador HL7, ~1 min por arquivo) ficam fora da suíte padrão.
# Rodar com: .venv\Scripts\python -m pytest -m integracao
addopts = -m "not integracao"
markers =
    integracao: precisa de Docker e rede; roda o validador HL7 de verdade
